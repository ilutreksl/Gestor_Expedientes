N**\n\n*Generado automáticamente el 16 de enero de 2026*  \n*Gestor de Expedientes RMA v1.0.11*  \n*Total de funciones documentadas: 300+*  \n*Archivos analizados: app.py + 29 librerías*\n\n## RESUMEN EJECUTIVO\n\n### Estadísticas del Proyecto\n- **Archivo Principal (app.py)**: 18,813 líneas, >200 funciones\n- **Librerías (lib/)**: 29 archivos Python\n- **Total Funciones Documentadas**: ~300+ funciones\n- **Clases Principales**: `LoginApp`, `VentanaPrincipal`\n- **Base de Datos**: Turso (libSQL) / SQLite local (modo híbrido)\n- **Framework UI**: CustomTkinter\n\n### Arquitectura de la Aplicación\n\n```\n┌─────────────────────────────────────┐\n│         LOGIN (LoginApp)            │\n│  - Autenticación con bcrypt         │\n│  - Carga de tema personalizado      │\n└─────────────┬───────────────────────┘\n              │\n              ▼\n┌─────────────────────────────────────┐\n│    VENTANA PRINCIPAL                │\n│  (VentanaPrincipal)                 │\n├─────────────────────────────────────┤\n│ • Dashboard                         │\n│ • Gestión de Expedientes RMA        │\n│ • Gestión de Clientes               │\n│ • Gestión de Artículos              │\n│ • Sistema de Búsqueda               │\n│ • Estadísticas                      │\n│ • Adjuntos (Dropbox/Local)          │\n│ • Tareas y Recordatorios            │\n│ • Gestión RMP                       │\n│ • Administración                    │\n└─────────────────────────────────────┘\n```\n\n### Flujo de Datos\n\n1. **Autenticación**: Usuario → LoginApp → BD (verificación bcrypt) → VentanaPrincipal\n2. **Expedientes**: Formulario → Validación → BD (rma_maestro + rma_detalles) → Lista\n3. **Adjuntos**: Archivo → Compresión → Dropbox/Local → BD (registro) → Lista\n4. **Búsqueda**: Término → Query multi-tabla → Resultados → Navegación\n5. **Estadísticas**: Filtros → Aggregation queries → Gráficos → Exportación\n\n"}};

<script>
(function () {
  "use strict";

  var DOCS = window.WIKI_DOCS || {};
  var contentEl = document.getElementById("wiki-content");
  var tocEl = document.getElementById("wiki-toc");
  var searchEl = document.getElementById("wiki-search");
  var tabButtons = document.querySelectorAll(".tab-btn");

  var renderedCache = {};
  var tocTreeCache = {};
  var currentDoc = null;

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function slugify(str) {
    return String(str)
      .toLowerCase()
      .replace(/`/g, "")
      .replace(/[^\p{L}\p{N}\s-]/gu, "")
      .trim()
      .replace(/\s+/g, "-");
  }

  function buildRenderer() {
    var renderer = new marked.Renderer();
    var counts = {};
    var headings = [];
    renderer.heading = function (text, level, raw) {
      var slug = slugify(raw) || "seccion";
      if (counts[slug] != null) {
        counts[slug] += 1;
        slug = slug + "-" + counts[slug];
      } else {
        counts[slug] = 0;
      }
      headings.push({ level: level, text: raw, slug: slug });
      return '<h' + level + ' id="' + slug + '">' + text + '</h' + level + '>\n';
    };
    return { renderer: renderer, headings: headings };
  }

  function buildTocTree(headings) {
    var tree = [];
    var current = null;
    headings.forEach(function (h) {
      if (h.level === 2) {
        current = { text: h.text, slug: h.slug, children: [] };
        tree.push(current);
      } else if (h.level === 3 && current) {
        current.children.push(h);
      }
    });
    return tree;
  }

  function renderDoc(key) {
    if (renderedCache[key]) return renderedCache[key];
    var built = buildRenderer();
    var html = marked.parse(DOCS[key].md, { renderer: built.renderer, gfm: true });
    renderedCache[key] = html;
    tocTreeCache[key] = buildTocTree(built.headings);
    return html;
  }

  function renderTocTree(tree, query) {
    var q = (query || "").trim().toLowerCase();
    var html = '<ul class="toc-list">';
    tree.forEach(function (node) {
      var childMatches = node.children.filter(function (c) {
        return !q || c.text.toLowerCase().indexOf(q) !== -1;
      });
      var selfMatches = !q || node.text.toLowerCase().indexOf(q) !== -1;
      if (!selfMatches && childMatches.length === 0) return;

      html += '<li><a href="#' + node.slug + '" data-slug="' + node.slug + '">' + escapeHtml(node.text) + "</a>";
      var childList = q ? (selfMatches ? node.children : childMatches) : node.children;
      if (childList.length) {
        html += '<ul class="toc-sub">';
        childList.forEach(function (c) {
          html += '<li><a href="#' + c.slug + '" data-slug="' + c.slug + '">' + escapeHtml(c.text) + "</a></li>";
        });
        html += "</ul>";
      }
      html += "</li>";
    });
    html += "</ul>";
    return html;
  }

  function showDoc(key) {
    currentDoc = key;
    contentEl.innerHTML = renderDoc(key);
    searchEl.value = "";
    tocEl.innerHTML = renderTocTree(tocTreeCache[key], "");
    tabButtons.forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-doc") === key);
    });
    contentEl.scrollTop = 0;
  }

  tabButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      showDoc(btn.getAttribute("data-doc"));
    });
  });

  searchEl.addEventListener("input", function () {
    tocEl.innerHTML = renderTocTree(tocTreeCache[currentDoc], searchEl.value);
  });

  tocEl.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-slug]");
    if (!a) return;
    e.preventDefault();
    var target = document.getElementById(a.getAttribute("data-slug"));
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  showDoc("manual");
})();

</script>
